le(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><circle cx="21" cy="0" r="5" fill="white"/></g></marker><marker id="legend-one" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><path d="M20,-7 L20,7"/></g></marker><marker id="legend-one-many" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M2,-7 L14,0 L2,7 M2,0 L14,0"/><path d="M20,-7 L20,7"/></g></marker></defs><rect x="0" y="0" width="1600" height="144" rx="0" fill="#10243A" stroke="#10243A"/><text x="64" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#A9C7E4"><tspan x="64" dy="0">NOTAÇÃO E CRITÉRIOS</tspan></text><text x="64" y="86" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF"><tspan x="64" dy="0">Como ler este modelo</tspan></text><text x="64" y="122" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#CEDBE8"><tspan x="64" dy="0">Cardinalidades verificadas nos índices e constraints; metadados completos no dicionário de dados</tspan></text><text x="64" y="1378" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#62728A"><tspan x="64" dy="0">FROTA · PF  /  Banco remoto · 16/10/2026 22:42 Manaus  /  legend</tspan></text><a href="#index"><text x="1420" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="1420" dy="0">← ÍNDICE</tspan></text></a><text x="64" y="208" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">PK / FK / UK</tspan></text><text x="496" y="208" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Chave primária / campo participante de FK / campo participante de índice único. UK pode ser composto; veja o índice completo no dicionário.</tspan></text><text x="64" y="296" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">não / sim na coluna NULO</tspan></text><text x="496" y="296" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Indica a propriedade IS_NULLABLE do campo. Defaults, expressões geradas e comentários estão nos metadados de cada campo e no</tspan><tspan x="496" dy="19">dicionário.</tspan></text><text x="64" y="384" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Pé de galinha: 0..N</tspan></text><text x="496" y="384" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Um registro pai pode possuir zero ou muitos filhos. A FK, isoladamente, não exige a existência de filhos.</tspan></text><text x="64" y="472" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Barra dupla: 1</tspan></text><text x="496" y="472" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Uma referência preenchida identifica exatamente um pai, desde que o conjunto referenciado seja único.</tspan></text><text x="64" y="560" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Círculo e barra: 0..1</tspan></text><text x="496" y="560" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Referência opcional, ou no máximo um filho por pai quando as colunas da FK têm unicidade efetiva.</tspan></text><text x="64" y="648" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Traço contínuo</tspan></text><text x="496" y="648" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">FK identificadora: todas as suas colunas participam da chave primária da tabela filha.</tspan></text><text x="64" y="736" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Traço descontínuo</tspan></text><text x="496" y="736" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">FK física não identificadora. Este estilo não significa relação inferida ou ausência de constraint.</tspan></text><text x="64" y="824" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">R001, R002, …</tspan></text><text x="496" y="824" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Identificador estável no catálogo de relacionamentos. Passe o cursor para consultar o nome da FK, colunas e regras ON DELETE/ON UPDATE.</tspan></text><text x="64" y="912" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Cartão REFERÊNCIA</tspan></text><text x="496" y="912" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Recorte de uma tabela definida em outra posição/página. Exibe as colunas alvo das FKs e mantém navegação para o domínio responsável.</tspan></text><text x="64" y="1000" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Fundo verde suave</tspan></text><text x="496" y="1000" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">LONGTEXT associado à validação JSON_VALID no MariaDB; o tipo físico foi preservado e o alias JSON está documentado.</tspan></text><text x="64" y="1088" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Fundo âmbar</tspan></text><text x="496" y="1088" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Ponto de divergência: instalacao_id existe em posicoes_rastreamento, mas não possui FK para instalação no remoto.</tspan></text><text x="64" y="1176" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#173A64"><tspan x="64" dy="0">Relações compostas</tspan></text><text x="496" y="1176" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#33455E"><tspan x="496" dy="0">Um único conector representa toda a constraint. Os pares de colunas são preservados no tooltip e no catálogo, na ordem original.</tspan></text></svg></section><section id="overview" hidden><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1760" height="1936" viewBox="0 0 1760 1936"><rect width="100%" height="100%" fill="white"/><defs><marker id="overview-zero-many" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M2,-7 L14,0 L2,7 M2,0 L14,0"/><circle cx="21" cy="0" r="5" fill="white"/></g></marker><marker id="overview-zero-one" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><circle cx="21" cy="0" r="5" fill="white"/></g></marker><marker id="overview-one" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><path d="M20,-7 L20,7"/></g></marker><marker id="overview-one-many" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g t da em MySQL isolado; diferenças de representação entre engines são classificadas separadamente</tspan></text><text x="64" y="1410" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#62728A"><tspan x="64" dy="0">FROTA · PF  /  Banco remoto · 16/10/2026 22:42 Manaus  /  differences</tspan></text><a href="#index"><text x="1580" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#FFFFFF"><tspan x="1580" dy="0">← ÍNDICE</tspan></text></a><text x="64" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Inventário</tspan></text><text x="464" y="226" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">Local: 74 tabelas, 182 FKs, 124 triggers. Remoto: 73 tabelas, 178 FKs, 122 triggers.</tspan></text><text x="64" y="354" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Tabela ausente</tspan></text><text x="464" y="354" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">veiculo_rastreadores</tspan></text><text x="64" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">FKs ausentes</tspan></text><text x="464" y="482" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">fk_vr_veiculo · fk_vr_rastreador · fk_vr_autor · fk_posicao_instalacao</tspan></text><text x="64" y="610" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Triggers substituídas</tspan></text><text x="464" y="610" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">Ausentes: tg_posicao_bi, tg_instalacao_rastreador_bu e tg_preservar_veiculo_rastreadores_bd.</tspan><tspan x="464" dy="21">Adicional: tg_posicao_sem_instalacao_bi.</tspan></text><text x="64" y="738" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Campo sem integridade referencial</tspan></text><text x="464" y="738" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">posicoes_rastreamento.instalacao_id continua presente, mas não possui a FK local.</tspan><tspan x="464" dy="21">Nenhum relacionamento foi inventado para esse campo.</tspan></text><text x="64" y="866" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">JSON e checks</tspan></text><text x="464" y="866" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">Seis campos JSON são armazenados como LONGTEXT com JSON_VALID no MariaDB.</tspan><tspan x="464" dy="21">Os 100 checks remotos incluem essas seis validações automáticas.</tspan></text><text x="64" y="994" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Definições comparadas</tspan></text><text x="464" y="994" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">2 campos com propriedades distintas; 3 views, 0 procedures e 0 triggers com diferenças textuais normalizadas.</tspan></text><text x="64" y="1122" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Dependências a revisar</tspan></text><text x="464" y="1122" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">0 referências textuais em objetos instalados à tabela ausente.</tspan><tspan x="464" dy="21">Consulte divergencias-banco-remoto.md e comparacao-estrutural.json para os detalhes.</tspan></text><text x="64" y="1250" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#8C541B"><tspan x="64" dy="0">Escopo da validação</tspan></text><text x="464" y="1250" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#33455E"><tspan x="464" dy="0">DDL lido e comparado; rotinas de negócio não foram executadas.</tspan><tspan x="464" dy="21">Nenhuma alteração do banco foi realizada para elaborar a documentação.</tspan></text></svg></section><section id="objects" hidden><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1760" height="2608" viewBox="0 0 1760 2608"><rect width="100%" height="100%" fill="white"/><defs><marker id="objects-zero-many" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M2,-7 L14,0 L2,7 M2,0 L14,0"/><circle cx="21" cy="0" r="5" fill="white"/></g></marker><marker id="objects-zero-one" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><circle cx="21" cy="0" r="5" fill="white"/></g></marker><marker id="objects-one" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M5,-7 L5,7"/><path d="M20,-7 L20,7"/></g></marker><marker id="objects-one-many" viewBox="-30 -10 30 20" refX="0" refY="0" markerWidth="30" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><g transform="scale(-1,1)" stroke="#6D7E94" stroke-width="1.3" fill="none"><path d="M2,-7 L14,0 L2,7 M2,0 L14,0"/><path d="M20,-7 L20,7"/></g></marker></defs><rect x="0" y="0" width="1760" height="144" rx="0" fill="#10243A" stroke="#10243A"/><text x="64" y="36" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#A9C7E4"><tspan x="64" dy="0">CATÁLOGO DE OBJETOS EXECUTÁVEIS</tspan></text><text x="64" y=
