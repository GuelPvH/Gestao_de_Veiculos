<VirtualHost *:${PORT}>
    ServerName localhost
    DocumentRoot /var/www/html/public

    # O alias padrão do Apache para /icons/ aponta para seus ícones internos.
    # A aplicação usa este caminho para os SVG públicos de navegação.
    Alias /icons/ /var/www/html/public/icons/

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript text/javascript application/json image/svg+xml
    </IfModule>

    <IfModule mod_headers.c>
        <LocationMatch "^/build/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
        <LocationMatch "^/(images|icons)/">
            Header set Cache-Control "public, max-age=604800"
        </LocationMatch>
    </IfModule>

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^/redefinir-senha(?:/|$)" recovery_secret
    CustomLog /proc/self/fd/1 combined env=!recovery_secret
</VirtualHost>
