<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog /proc/self/fd/2
    SetEnvIf Request_URI "^/redefinir-senha/" recovery_secret
    CustomLog /proc/self/fd/1 combined env=!recovery_secret
</VirtualHost>
