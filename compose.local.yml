services:
  app:
    environment:
      DB_HOST: mysql-local
      DB_PORT: 3306
      DB_DATABASE: frota_pf_local
      DB_USERNAME: frota_local
      DB_PASSWORD: "${LOCAL_DB_PASSWORD:?Configure LOCAL_DB_PASSWORD}"
    depends_on:
      mysql-local:
        condition: service_healthy
  phpmyadmin:
    environment:
      PMA_HOST: mysql-local
      PMA_PORT: 3306
  mysql-local:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: frota_pf_local
      MYSQL_USER: frota_local
      MYSQL_PASSWORD: "${LOCAL_DB_PASSWORD:?Configure LOCAL_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${LOCAL_DB_ROOT_PASSWORD:?Configure LOCAL_DB_ROOT_PASSWORD}"
      TZ: UTC
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --default-time-zone=+00:00]
    volumes:
      - local_mysql:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping --silent"]
      interval: 5s
      retries: 30
volumes:
  local_mysql:
