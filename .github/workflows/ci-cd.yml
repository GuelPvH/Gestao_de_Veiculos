name: Laravel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  workflow-check:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and run actionlint
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:2.10.3
      - name: Validate and audit Composer lock
        run: |
          composer --no-plugins --no-scripts validate --strict
          composer --no-plugins --no-scripts audit --locked --abandoned=fail
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Audit npm lock
        run: npm audit --package-lock-only --audit-level=high

  php:
    name: PHP ${{ matrix.php }}
    needs: [workflow-check, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      DB_URL: ''
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:2.10.3
      - name: Install PHP dependencies without project scripts
        run: composer install --no-scripts --no-plugins --prefer-dist --no-progress --no-interaction
      - name: Register packages and generate an ephemeral test key
        run: |
          php artisan package:discover
          echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"
      - name: Check PHP formatting
        run: vendor/bin/pint --test
      - name: Analyse PHP
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Run tests without a persistent database
        run: php artisan test --no-ansi

  frontend:
    name: Frontend build
    needs: [workflow-check, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Build Bootstrap and Vite assets
        run: npm run build

  container:
    name: Container build
    needs: [workflow-check, audit, php, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build application image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          provenance: false
          tags: gestao-veiculos-ci:${{ github.sha }}
      - name: Check runtime user and HTTP port
        env:
          REVISION: ${{ github.sha }}
        run: |
          image="gestao-veiculos-ci:$REVISION"
          user=$(docker image inspect "$image" --format '{{.Config.User}}')
          ports=$(docker image inspect "$image" --format '{{json .Config.ExposedPorts}}')
          [[ "$user" == www-data ]]
          [[ "$ports" == *'"8080/tcp"'* ]]

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [workflow-check, audit, php, frontend, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          WORKFLOW_RESULT: ${{ needs.workflow-check.result }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          PHP_RESULT: ${{ needs.php.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          [[ "$WORKFLOW_RESULT" == success &&
             "$AUDIT_RESULT" == success &&
             "$PHP_RESULT" == success &&
             "$FRONTEND_RESULT" == success &&
             "$CONTAINER_RESULT" == success ]]
